<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="raffy. hi. i live in cagayan de oro, in the philippines. i make software for offices." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text{font-family:"Times New Roman",Times,serif;fill:#000}
    @media (prefers-reduced-motion:no-preference){
      text{animation:c 24s infinite}
    }
    @keyframes c{
      0%,16%{fill:#000}
      17%,33%{fill:#1F3BFF}
      34%,50%{fill:#D6007A}
      51%,66%{fill:#0A7A3B}
      67%,83%{fill:#6B2BD9}
      84%,99%{fill:#B83A00}
      100%{fill:#000}
    }
  </style>
  <rect width="1200" height="440" fill="#FFF59A"/>
  <text x="58" y="190" font-size="176" font-weight="700" letter-spacing="-9">raffy.</text>
  <text x="64" y="250" font-size="28">hi. i live in cagayan de oro, in the philippines.</text>
  <text x="64" y="340" font-size="66" font-weight="700" letter-spacing="-2">i make software for offices.</text>
  <text x="64" y="400" font-size="20">the text changes color by itself. i didn’t touch it.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
